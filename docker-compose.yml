services:
  db:
    container_name: postgres-spring-boot
    image: postgres:latest
    environment:
       POSTGRES_USER: amigoscode
       POSTGRES_PASSWORD: password
       PGDATA: /data/postgres
    ports:
      - "5332:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
    
    